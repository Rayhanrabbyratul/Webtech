<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Techflow Solutions</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 20px;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-form {
            background-color: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 300px;
        }

        .signup-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .signup-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .signup-form input, .signup-form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .signup-form button {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-form button:hover {
            background-color: green;
        }

        .bottom-footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="top-footer">
        Techflow Solutions
    </div>

    <div class="content">
        <div class="signup-form">
            <h2>Create Account</h2>
            <form>
                 <label for ="Email Address">Email:</label> <br>
     <input type="email" id="" name ="Email Address" placeholder="you@example.com"/>
     <br></br>

    <label for="password">Password:</label>
<input type="password" name="password" id="password">
<br><br>

<label for="password"> Confirm Password:</label>
<input type="password" name="password" id="password">
<br><br>

<label for="Gender">Select Gender:</label>
    <select>
     <option value="" disabled selected>Select Gender</option>
        <option value="male">MALE</option>></option>
        <option value="FEMALE">EEE</option>
        <option value="OTHERS">CNCS</option>
      
    </select>

                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <div class="bottom-footer">
        © 2026 Techflow Solutions. All rights reserved.
    </div>

</body>
</html>
